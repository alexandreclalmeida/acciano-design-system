name: Chromatic

on:
  push:
    branches:
      - main
    paths:
      - "packages/components/**"
      - "packages/tokens/**"
      - "packages/icons/**"
      - "packages/logos/**"
      - "apps/storybook/**"

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Publish to Chromatic
        run: npm run chromatic -- --only-changed
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
